name: blind_navigation
description: Application de navigation vocale pour aveugles
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP requests (Nominatim geocoding + OSRM routing – directs depuis Flutter)
  http: ^1.1.0

  # GPS location
  geolocator: ^10.1.0

  # Text-to-Speech (vocal)
  flutter_tts: ^4.0.2

  # ✅ STT local natif (remplace Whisper Python backend)
  speech_to_text: ^7.0.0

  # File system
  path_provider: ^2.1.1

  # Permissions (micro + localisation)
  permission_handler: ^11.0.1

  # 🔵 Bluetooth (canne intelligente)
  flutter_blue_plus: ^1.32.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
